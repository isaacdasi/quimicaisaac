<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego Phaser - Atrapa el Átomo</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #222; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 400,
        height: 600,
        physics: { default: 'arcade', arcade: { gravity: { y: 150 }, debug: false } },
        scene: { create: create, update: update }
    };

    let matraz; let atomos; let puntaje = 0; let textoPuntaje;

    function create() {
        this.cameras.main.setBackgroundColor('#2d2d2d');
        matraz = this.add.rectangle(200, 550, 80, 20, 0x00aaff);
        this.physics.add.existing(matraz);
        matraz.body.setImmovable(true);
        matraz.body.allowGravity = false;

        textoPuntaje = this.add.text(16, 16, 'Atomos atrapados: 0', { fontSize: '24px', fill: '#ffffff' });
        atomos = this.physics.add.group();

        this.time.addEvent({ delay: 1000, callback: generarAtomo, callbackScope: this, loop: true });
        this.physics.add.overlap(matraz, atomos, atraparAtomo, null, this);
    }

    function update() {
        if (this.input.activePointer.isDown || this.input.activePointer.x > 0) {
            matraz.x = Phaser.Math.Clamp(this.input.activePointer.x, 40, 360);
        }
    }

    function generarAtomo() {
        let xAleatorio = Phaser.Math.Between(20, 380);
        let atomo = this.add.circle(xAleatorio, 0, 15, 0xff3333);
        this.physics.add.existing(atomo);
        atomos.add(atomo);
    }

    function atraparAtomo(jugador, atomo) {
        atomo.destroy();
        puntaje += 1;
        textoPuntaje.setText('Atomos atrapados: ' + puntaje);
        this.tweens.add({ targets: jugador, scaleX: 1.2, scaleY: 1.2, duration: 100, yoyo: true });
    }

    const game = new Phaser.Game(config);
</script>
</body>
</html>
